name: page-test-action
description: Test your web pages for errors in GitHub Actions
author: remarkablemark

inputs:
  url:
    description: URL of the page to test
    required: true
  browser:
    description: Browser to use (chromium, firefox, or webkit)
    default: chromium
  timeout:
    description: Navigation timeout in milliseconds
    default: 30000
  playwright-version:
    description: Playwright npm version to install
    default: latest
  start:
    description: Shell command to start a local server in the background
  wait-on:
    description: URL to poll until available before running the page check
  cache:
    description: Cache Playwright browser binaries
    default: true

runs:
  using: composite
  steps:
    - name: Restore Playwright cache
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.playwright-version }}-${{ runner.os }}-${{ inputs.browser }}

    - name: Install Playwright
      shell: bash
      run: |
        npm install playwright@"$PLAYWRIGHT_VERSION" --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
        npm exec --prefix "$GITHUB_ACTION_PATH" -- playwright install --with-deps "$BROWSER"
      env:
        PLAYWRIGHT_VERSION: ${{ inputs.playwright-version }}
        BROWSER: ${{ inputs.browser }}

    - name: Start server
      if: inputs.start != ''
      id: start-server
      shell: bash
      run: |
        bash -c "$START" &
        echo "pid=$!" >> "$GITHUB_OUTPUT"
        i=0; until curl -sf "$WAIT_ON" > /dev/null || [ $i -ge 60 ]; do sleep 1; i=$((i+1)); done
      env:
        START: ${{ inputs.start }}
        WAIT_ON: ${{ inputs.wait-on }}

    - name: Run page check
      shell: bash
      run: node "$GITHUB_ACTION_PATH/page-test.mjs"
      env:
        URL: ${{ inputs.url }}
        BROWSER: ${{ inputs.browser }}
        TIMEOUT: ${{ inputs.timeout }}

    - name: Stop server
      if: inputs.start != '' && always()
      shell: bash
      run: kill "$SERVER_PID" 2>/dev/null || true
      env:
        SERVER_PID: ${{ steps.start-server.outputs.pid }}

branding:
  icon: check-circle
  color: green
